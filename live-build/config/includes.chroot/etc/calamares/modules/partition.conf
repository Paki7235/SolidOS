---
# Btrfs con subvolumi: necessario per la Linea del Tempo
efiSystemPartition: "/boot/efi"
efiSystemPartitionSize: 512M
efiSystemPartitionName: EFI
userSwapChoices: [ none, file ]
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
# Niente partizioni a mano: si sceglie solo il disco (cancella tutto, accanto a un altro
# sistema o sostituisci una partizione); le partizioni giuste le crea l'installatore,
# compresa quella EFI (o bios_grub sui PC vecchi)
allowManualPartitioning: false
defaultPartitionTableType: gpt
requiredPartitionTableType: [ gpt, msdos ]
showNotEncryptedBootMessage: false
initialFileSystemType: btrfs
availableFileSystemTypes: [ "btrfs", "ext4" ]
enableLuksAutomatedPartitioning: true
defaultFileSystemType: "btrfs"
