# Opzioni di montaggio delle unità esterne.
# NTFS con il driver del kernel ntfs3 (più veloce), ntfs-3g come riserva.
# HFS+ in sola lettura: la scrittura su HFS+ con journal non è sicura.
[defaults]
ntfs_drivers=ntfs3,ntfs
ntfs3_defaults=uid=$UID,gid=$GID,windows_names,prealloc
ntfs3_allow=uid=$UID,gid=$GID,umask,dmask,fmask,iocharset,nohidden,sys_immutable,windows_names,discard,force,sparse,showmeta,prealloc,ro
hfsplus_defaults=ro,uid=$UID,gid=$GID
hfsplus_allow=ro,uid=$UID,gid=$GID
exfat_defaults=uid=$UID,gid=$GID,iocharset=utf8,errors=remount-ro
vfat_defaults=uid=$UID,gid=$GID,shortname=mixed,utf8=1,showexec,flush
