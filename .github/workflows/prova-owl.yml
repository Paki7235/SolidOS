# Prova rapida della compilazione di OWL (AWDL per AirDrop) su Debian 13,
# con tutto l'output visibile. Avvio manuale: gh workflow run prova-owl.yml
name: Prova OWL

on:
  workflow_dispatch:

jobs:
  owl:
    runs-on: ubuntu-24.04
    container: debian:trixie
    steps:
      - name: Dipendenze
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends ca-certificates git cmake build-essential pkg-config \
            libpcap-dev libev-dev libnl-3-dev libnl-genl-3-dev libnl-route-3-dev
      - name: Sorgenti
        run: |
          git clone --depth 1 --recurse-submodules https://github.com/seemoo-lab/owl.git /tmp/owl
          cd /tmp/owl && git log -1 --format='%H %cd' && ls
      - name: Configurazione
        run: cmake -S /tmp/owl -B /tmp/owl/build -DCMAKE_BUILD_TYPE=Release
      - name: Compilazione
        run: cmake --build /tmp/owl/build -j"$(nproc)" -- VERBOSE=0 2>&1 | tail -80
      - name: Risultato
        run: find /tmp/owl/build -type f -name owl -perm -u+x -exec ls -l {} \;
