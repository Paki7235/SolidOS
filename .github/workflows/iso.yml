# Build delle ISO su GitHub: amd64 (PC Intel/AMD) e arm64 (macchine virtuali su Mac
# Apple Silicon e PC ARM), ognuna sul proprio runner nativo.
# Ogni ISO è pubblicata come UN SOLO FILE nella Release «build-N» (limite di GitHub:
# 2 GiB per file; la build si ferma con un errore chiaro se la ISO lo supera).
name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

env:
  TAG: build-${{ github.run_number }}

jobs:
  # La Release nasce come bozza: diventa pubblica solo se almeno una ISO è pronta
  rilascio:
    runs-on: ubuntu-24.04
    steps:
      - name: Crea la Release (bozza)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft \
            --title "SolidOS $TAG" --notes "SolidOS compilato da ${{ github.sha }}.

          - **solidos-…-amd64.iso**: PC Intel/AMD (anche Mac Intel). Scrivila su una chiavetta (Crea chiavetta, balenaEtcher, Rufus in modalità DD) oppure usala in una macchina virtuale.
          - **solidos-…-arm64.iso**: macchine virtuali sui Mac con Apple Silicon (UTM, Parallels, VMware Fusion) e PC ARM con UEFI.

          Ogni ISO è un file unico, pronto da usare. Verifica (facoltativa): \`shasum -a 256 FILE.iso\` deve dare il valore nel file .sha256 corrispondente."

  iso:
    needs: rilascio
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Libera spazio sul disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Controlli statici
        if: matrix.arch == 'amd64'
        run: ./scripts/controlla.sh

      - name: Build della ISO ${{ matrix.arch }}
        run: ./build.sh

      - name: Controlla la dimensione (un file unico deve stare sotto i 2 GiB)
        run: |
          cd dist
          ISO=$(ls *.iso)
          DIM=$(stat -c %s "$ISO")
          echo "$ISO: $DIM byte"
          if [ "$DIM" -ge 2147483648 ]; then
            echo "::error::$ISO pesa $DIM byte: supera i 2 GiB per file di GitHub. Togli qualche pacchetto."
            exit 1
          fi
          mv licenze-pacchetti.tsv "licenze-pacchetti-$ARCH.tsv"
          ls -lh

      - name: Carica la ISO nella Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber \
            *.iso *.iso.sha256 *.build.log *.pacchetti.txt "licenze-pacchetti-$ARCH.tsv"

      - name: Registro della build (in caso di errore)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist 2>/dev/null && ls *.build.log >/dev/null 2>&1 \
            && gh release upload "$TAG" --repo "${{ github.repository }}" --clobber *.build.log || true

  pubblica:
    needs: iso
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Pubblica la Release (o la elimina se non c'è nessuna ISO)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -q '\.iso$'; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
          else
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            exit 1
          fi
