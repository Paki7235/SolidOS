# Build della ISO su runner x86_64 di GitHub.
# La ISO viene pubblicata in una Release (le Release non consumano lo spazio
# degli artefatti); è divisa in parti da 1,9 GB perché ogni file di una Release
# può pesare al massimo 2 GB. Per ricomporla: cat solidos-*.iso.parte-* > solidos.iso
name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Libera spazio sul disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Controlli statici
        run: ./scripts/controlla.sh

      - name: Build della ISO
        run: ./build.sh

      - name: Prepara i file della Release
        run: |
          cd dist
          ISO=$(ls *.iso)
          sha256sum "$ISO" > "$ISO.sha256"
          split -b 1900M -d -a 2 "$ISO" "$ISO.parte-"
          ls -lh
          echo "ISO=$ISO" >> "$GITHUB_ENV"

      - name: Pubblica la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          cd dist
          gh release create "$TAG" --title "ISO $TAG" --notes "ISO compilata da ${{ github.sha }}.

          Ricomponi le parti:
          - macOS/Linux: \`cat ${ISO}.parte-* > ${ISO}\`
          - Windows: \`copy /b ${ISO}.parte-00 + ${ISO}.parte-01 ${ISO}\` (aggiungi le altre parti se presenti)

          Verifica: \`shasum -a 256 ${ISO}\` deve dare il valore in ${ISO}.sha256." \
            "$ISO".parte-* "$ISO.sha256" *.build.log licenze-pacchetti.tsv *.pacchetti.txt

      - name: Registro della build (anche in caso di errore)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: registro-build
          path: |
            dist/*.build.log
          retention-days: 7
          if-no-files-found: ignore
