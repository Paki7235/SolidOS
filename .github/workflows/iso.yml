# Build delle ISO su GitHub: amd64 (PC Intel/AMD) e arm64 (macchine virtuali su Mac
# Apple Silicon e PC ARM), ognuna sul proprio runner nativo.
# Ogni ISO è pubblicata come UN SOLO FILE nella Release «build-N» (limite di GitHub:
# 2 GiB per file; la build si ferma con un errore chiaro se la ISO lo supera).
name: Build ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"

permissions:
  contents: write

concurrency:
  group: build-iso
  cancel-in-progress: true

env:
  TAG: build-${{ github.run_number }}

jobs:
  # La Release nasce come bozza: diventa pubblica solo se almeno una ISO è pronta
  rilascio:
    runs-on: ubuntu-24.04
    steps:
      - name: Crea la Release (bozza)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --repo "${{ github.repository }}" --target "${{ github.sha }}" --draft \
            --title "SolidOS $TAG" --notes "SolidOS compilato da ${{ github.sha }}.

          - **solidos-…-amd64.iso**: PC Intel/AMD (anche Mac Intel). Scrivila su una chiavetta (Crea chiavetta, balenaEtcher, Rufus in modalità DD) oppure usala in una macchina virtuale.
          - **solidos-…-arm64.iso**: macchine virtuali sui Mac con Apple Silicon (UTM, Parallels, VMware Fusion) e PC ARM con UEFI.

          Ogni ISO è un file unico, pronto da usare: scaricala e basta."

  iso:
    needs: rilascio
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - name: Libera spazio sul disco del runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          docker system prune -af >/dev/null 2>&1 || true
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Numero di versione (per gli aggiornamenti dal PC)
        run: |
          printf '%s\n' "${{ github.run_number }}" > src/dati/versione
          git log -1 --format=%s > src/dati/novita

      - name: Controlli statici
        if: matrix.arch == 'amd64'
        run: ./scripts/controlla.sh

      - name: Build della ISO ${{ matrix.arch }}
        run: ./build.sh

      - name: Controlla la dimensione (un file unico deve stare sotto i 2 GiB)
        run: |
          cd dist
          ISO=$(ls *.iso)
          DIM=$(stat -c %s "$ISO")
          echo "$ISO: $DIM byte"
          if [ "$DIM" -ge 2147483648 ]; then
            echo "::error::$ISO pesa $DIM byte: supera i 2 GiB per file di GitHub. Togli qualche pacchetto."
            exit 1
          fi
          ls -lh

      - name: Carica la ISO nella Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          # Solo la ISO: impronta SHA-256 aggiunta al testo della Release (niente file in più)
          gh release upload "$TAG" --repo "${{ github.repository }}" --clobber *.iso
          ISO=$(ls *.iso)
          NOTE=$(gh release view "$TAG" --repo "${{ github.repository }}" --json body -q .body)
          gh release edit "$TAG" --repo "${{ github.repository }}" --notes "$NOTE
          
          SHA-256 di $ISO: \`$(sha256sum "$ISO" | cut -d' ' -f1)\`"

      - name: Registro della build (in caso di errore, tra gli artefatti per 3 giorni)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: registro-build-${{ matrix.arch }}
          path: dist/*.build.log
          retention-days: 3
          if-no-files-found: ignore

  # Pacchetto di aggiornamento: i file di SolidOS di questa build, installabili da un PC
  # già installato (Impostazioni › Aggiornamenti). Stesso pacchetto per Intel/AMD e ARM.
  aggiornamento:
    needs: iso
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Crea il pacchetto
        run: |
          printf '%s\n' "${{ github.run_number }}" > src/dati/versione
          git log -1 --format=%s > src/dati/novita
          ./scripts/genera-branding.sh build/albero --senza-immagini
          N=${{ github.run_number }}
          FILE=solidos-aggiornamento-$N.tar.xz
          tar -C build/albero/config/includes.chroot --owner=0 --group=0 -cJf "$FILE" .
          NOVITA=$(git log -1 --format=%s)
          python3 - "$N" "$FILE" "$NOVITA" <<'PY'
          import hashlib, json, sys
          n, file, novita = sys.argv[1:4]
          sha = hashlib.sha256(open(file, "rb").read()).hexdigest()
          json.dump({"versione": int(n), "file": file, "sha256": sha, "novita": novita,
                     "commit": "${{ github.sha }}"}, open("versione.json", "w"), ensure_ascii=False)
          PY
          cat versione.json; ls -la "$FILE"
      - name: Pubblica (Release «aggiornamento», sempre la stessa)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          R="${{ github.repository }}"
          gh release view aggiornamento --repo "$R" >/dev/null 2>&1 || \
            gh release create aggiornamento --repo "$R" --latest=false --title "Aggiornamenti di SolidOS" \
              --notes "Pacchetto con l'ultima versione di SolidOS, usato da Impostazioni › Aggiornamenti sui PC già installati."
          gh release upload aggiornamento --repo "$R" --clobber solidos-aggiornamento-*.tar.xz
          gh release upload aggiornamento --repo "$R" --clobber versione.json
          # restano solo l'ultimo pacchetto e la sua scheda
          gh release view aggiornamento --repo "$R" --json assets -q '.assets[].name' \
            | grep '^solidos-aggiornamento-' | grep -vx "solidos-aggiornamento-${{ github.run_number }}.tar.xz" \
            | while read -r vecchio; do gh release delete-asset aggiornamento "$vecchio" --repo "$R" --yes; done

  pubblica:
    needs: iso
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Pubblica la Release (o la elimina se non c'è nessuna ISO)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[].name' | grep -q '\.iso$'; then
            gh release edit "$TAG" --repo "${{ github.repository }}" --draft=false --latest
            # Resta solo l'ultima ISO: le build precedenti si tolgono
            gh release list --repo "${{ github.repository }}" --limit 200 --json tagName -q '.[].tagName' \
              | grep '^build-' | grep -vx "$TAG" \
              | while read -r vecchia; do gh release delete "$vecchia" --repo "${{ github.repository }}" --yes --cleanup-tag; done
          else
            gh release delete "$TAG" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            exit 1
          fi
