  :root{
    --bg:#000000;
    --fg:#ffffff;
    --track:rgba(255,255,255,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"League Spartan","Helvetica Neue",Arial,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .stage{display:flex;flex-direction:column;align-items:center;gap:40px}
  .logo{
    display:flex;align-items:baseline;
    font-size:58px;           /* come in Canva */
    font-weight:700;
    letter-spacing:0;line-height:1;
    opacity:0;
  }
  .s{position:relative;z-index:2;font-size:1.6em}  /* S più grande */
  .tail{display:inline-block;overflow:hidden;white-space:nowrap}
  .tail-inner{display:inline-block}
  .bar{
    width:160px;height:4px;border-radius:999px;
    background:var(--track);overflow:hidden;opacity:0;
  }
  .fill{
    height:100%;width:100%;border-radius:inherit;
    background:var(--fg);
    transform-origin:left center;transform:scaleX(0);
  }
  .replay{
    position:fixed;bottom:24px;left:50%;transform:translateX(-50%);
    background:transparent;color:var(--fg);opacity:.35;
    border:1px solid rgba(255,255,255,.25);border-radius:999px;
    padding:8px 18px;font:inherit;font-size:15px;font-weight:700;cursor:pointer;
  }
  .replay:hover{opacity:1}
</style>
</head>
<body>
  <div class="stage">
    <div class="logo" id="logo">
      <span class="s">S</span><span class="tail" id="tail"><span class="tail-inner" id="tailInner">olidOS</span></span>
    </div>
    <div class="bar" id="bar"><div class="fill" id="fill"></div></div>
  </div>
  <button class="replay" id="replay">Riproduci</button>

<script>
  const logo = document.getElementById('logo');
  const tail = document.getElementById('tail');
  const tailInner = document.getElementById('tailInner');
  const bar = document.getElementById('bar');
  const fill = document.getElementById('fill');
  let running = [];

  function play(){
    running.forEach(a => a.cancel());
    running = [];
    tail.style.width = '';
    const w = tailInner.getBoundingClientRect().width;
    const ease = 'cubic-bezier(.65,0,.35,1)';

    // 1) Compare "SolidOS"
    running.push(logo.animate([
      {opacity:0, filter:'blur(10px)'},
      {opacity:1, filter:'blur(0)'}
    ], {duration:1200, easing:'cubic-bezier(.2,.8,.2,1)', fill:'forwards'}));

    // 2) Il testo scorre da destra verso sinistra e resta solo la "S"
    running.push(tail.animate([
      {width: w + 'px'}, {width: '0px'}
    ], {duration:1000, delay:2000, easing:ease, fill:'forwards'}));
    running.push(tailInner.animate([
      {transform:'translateX(0)', opacity:1},
      {transform:'translateX(-100%)', opacity:0}
    ], {duration:1000, delay:2000, easing:ease, fill:'forwards'}));

    // 3) Compare la barra di caricamento
    running.push(bar.animate([
      {opacity:0}, {opacity:1}
    ], {duration:500, delay:3200, easing:'ease-out', fill:'forwards'}));
    running.push(fill.animate([
      {transform:'scaleX(0)'},
      {transform:'scaleX(.35)', offset:.3},
      {transform:'scaleX(.6)',  offset:.6},
      {transform:'scaleX(1)'}
    ], {duration:2600, delay:3500, easing:'ease-in-out', fill:'forwards'}));
  }

  document.getElementById('replay').addEventListener('click', play);
  // Avvia dopo il caricamento del font, così le misure sono corrette
  window.addEventListener('load', () => {
    (document.fonts ? document.fonts.ready : Promise.resolve()).then(play);
  });
</script>
</body>
</html>
