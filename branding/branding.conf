# ─────────────────────────────────────────────────────────────────────────────
#  Branding del sistema — UNICA fonte di verità
#
#  Cambiando OS_NAME qui (e solo qui) cambiano: menu di avvio, Plymouth, nome
#  della ISO, /etc/os-release, hostname, utente live, temi, percorsi interni.
#  Tutti i file *.in del progetto usano i segnaposto @NOME_VARIABILE@.
#  Formato: sintassi shell (VARIABILE="valore"), nessun comando.
# ─────────────────────────────────────────────────────────────────────────────

# Identità
OS_NAME="SolidOS"
# Identificatore tecnico (minuscolo, solo a-z e 0-9). Vuoto = derivato da OS_NAME.
OS_ID=""
OS_VERSION="0.1"
OS_CODENAME="alba"
OS_TAGLINE="Il sistema che non si rompe, non rallenta e ricorda tutto."
OS_HOME_URL="https://example.org"          # da sostituire con il sito reale
OS_SUPPORT_URL="https://example.org/aiuto"
OS_BUG_URL="https://example.org/segnalazioni"

# Lingua e regione predefinite (file di testi in branding/testi/<LINGUA>.conf)
LINGUA="it"
LOCALE="it_IT.UTF-8"
TASTIERA="it"
FUSO_ORARIO="Europe/Rome"

# Colori (esadecimali #RRGGBB)
COLORE_ACCENTO="#3B82F6"
COLORE_ACCENTO_SCURO="#1D4ED8"
COLORE_SFONDO_SCURO="#0B1220"
COLORE_SUPERFICIE_SCURA="#141C2E"
COLORE_SFONDO_CHIARO="#F5F7FB"
COLORE_TESTO_SCURO="#0F172A"
COLORE_TESTO_CHIARO="#E8EEF8"

# Aspetto
FONT_UI="Inter"
FONT_UI_DIMENSIONE="10"
FONT_MONO="Noto Sans Mono"
TEMA_ICONE="Papirus-Dark"
TEMA_CURSORE="breeze_cursors"
DIMENSIONE_CURSORE="24"

# Avvio
TIMEOUT_MENU_AVVIO="8"
