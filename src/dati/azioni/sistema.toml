# Azioni predefinite della Barra Unica. Ogni frase viene normalizzata
# (minuscole, senza accenti, sinonimi: «spegni/disattiva» = off, «accendi/attiva» = on…).
# Per aggiungerne: crea un file .toml in ~/.config/<sistema>/azioni/ con la stessa struttura.

[[azione]]
id = "wifi-off"
titolo = "Spegni il Wi-Fi"
icona = "network-wireless-offline"
frasi = ["wifi off", "spegni wifi", "spegni il wifi", "disattiva wifi", "niente internet"]
comando = ["nmcli", "radio", "wifi", "off"]
messaggio = "Wi-Fi spento"
attendi = true

[[azione]]
id = "wifi-on"
titolo = "Accendi il Wi-Fi"
icona = "network-wireless"
frasi = ["wifi on", "accendi wifi", "accendi il wifi", "attiva wifi"]
comando = ["nmcli", "radio", "wifi", "on"]
messaggio = "Wi-Fi acceso"
attendi = true

[[azione]]
id = "bluetooth-off"
titolo = "Spegni il Bluetooth"
icona = "bluetooth-disabled"
frasi = ["bluetooth off", "spegni bluetooth", "spegni il bluetooth"]
comando = ["bluetoothctl", "power", "off"]
messaggio = "Bluetooth spento"
attendi = true

[[azione]]
id = "bluetooth-on"
titolo = "Accendi il Bluetooth"
icona = "bluetooth"
frasi = ["bluetooth on", "accendi bluetooth", "accendi il bluetooth"]
comando = ["bluetoothctl", "power", "on"]
messaggio = "Bluetooth acceso"
attendi = true

[[azione]]
id = "volume-su"
titolo = "Alza il volume"
icona = "audio-volume-high"
frasi = ["volume su", "alza volume", "alza il volume", "piu volume"]
interno = "volume"
passo = 10

[[azione]]
id = "volume-giu"
titolo = "Abbassa il volume"
icona = "audio-volume-low"
frasi = ["volume giu", "abbassa volume", "abbassa il volume", "meno volume"]
interno = "volume"
passo = -10

[[azione]]
id = "muto"
titolo = "Disattiva l'audio"
icona = "audio-volume-muted"
frasi = ["muto", "silenzio", "togli audio", "audio off"]
comando = ["wpctl", "set-mute", "@DEFAULT_AUDIO_SINK@", "toggle"]

[[azione]]
id = "luminosita-su"
titolo = "Aumenta la luminosità"
icona = "display-brightness"
frasi = ["luminosita su", "piu luce", "alza luminosita"]
comando = ["@OS_ID@-ctl", "luminosita", "15"]

[[azione]]
id = "luminosita-giu"
titolo = "Diminuisci la luminosità"
icona = "display-brightness"
frasi = ["luminosita giu", "meno luce", "abbassa luminosita"]
comando = ["@OS_ID@-ctl", "luminosita", "-15"]

[[azione]]
id = "non-disturbare-on"
titolo = "Attiva Non disturbare"
icona = "notifications-disabled"
frasi = ["non disturbare", "non disturbare on", "attiva non disturbare", "niente notifiche"]
comando = ["@OS_ID@-ctl", "non-disturbare", "si"]
messaggio = "Non disturbare attivo"

[[azione]]
id = "non-disturbare-off"
titolo = "Disattiva Non disturbare"
icona = "notifications"
frasi = ["non disturbare off", "disattiva non disturbare", "mostra notifiche"]
comando = ["@OS_ID@-ctl", "non-disturbare", "no"]

[[azione]]
id = "luce-notturna"
titolo = "Luce notturna"
icona = "weather-clear-night"
frasi = ["luce notturna", "modalita notte", "colori caldi"]
comando = ["@OS_ID@-impostazioni", "schermo"]

[[azione]]
id = "hotspot"
titolo = "Condividi la connessione (hotspot)"
icona = "network-wireless-hotspot"
frasi = ["hotspot", "hotspot on", "condividi connessione", "punto di accesso"]
comando = ["nmcli", "device", "wifi", "hotspot", "con-name", "Hotspot"]
messaggio = "Hotspot attivo: dati in Impostazioni → Wi-Fi e rete"
attendi = true

[[azione]]
id = "screenshot"
titolo = "Cattura lo schermo"
icona = "applets-screenshooter"
frasi = ["screenshot", "cattura schermo", "fai uno screenshot"]
comando = ["sh", "-c", "sleep 1; @OS_ID@-cattura --subito"]

[[azione]]
id = "registra-schermo"
