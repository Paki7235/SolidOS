icona = "system-lock-screen"
frasi = ["blocca", "blocca schermo", "blocca il computer"]
comando = ["swaylock", "-f"]

[[azione]]
id = "spegni-pc"
titolo = "Spegni il computer"
icona = "system-shutdown"
frasi = ["off computer", "off il computer", "off pc", "arresta"]
comando = ["systemctl", "poweroff"]

[[azione]]
id = "riavvia-pc"
